name: VanillaPlusSuite
version: '1.4.7'
main: com.iruixos.vanillaplussuite.VanillaPlusSuite
api-version: '26.3'
softdepend: [WayBridge]
author: iruixos
description: Modular Vanilla+ quality-of-life suite.
commands:
  afk:
    description: Toggle your AFK status
    usage: /afk
    permission: vanillaplussuite.afk
  sign:
    description: Format and customize the sign you are looking at (use /sign help)
    usage: /sign help
  vps:
    description: VanillaPlusSuite administration
    usage: /vps reload
    permission: vanillaplussuite.admin
permissions:
  vanillaplussuite.afk:
    default: true
  vanillaplussuite.admin:
    default: op
  vanillaplussuite.sign.color:
    default: true
  vanillaplussuite.sign.format:
    default: op
  vanillaplussuite.sign.hex:
    default: true
  vanillaplussuite.sign.command:
    default: true
  vanillaplussuite.sign.admin:
    default: op
