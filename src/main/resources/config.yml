# Bee assistance preserves vanilla pollen delivery; no honey is generated by this plugin.
bee-colony-cooperation:
  enabled: true
  # Bees with nectar may temporarily use an empty hive when their home is honey-full.
  share-honey: true
  search-radius: 12
  scan-interval-ticks: 100
  search-cooldown-seconds: 30
  empty-hives-only: true
  include-bee-nests: true
  include-beehives: true
  ignore-full-hives: true
  # Sneak + empty-hand right-click a hive to inspect occupants and honey.
  occupancy-inspection: true
  # Small particles when a scanned hive's honey level increases.
  activity-particles: true
  activity-radius: 8
  # Assign available hives to homeless bees, including displaced bees.
  improved-hive-selection: true
  relocation-assistance: true
  # Allow homeless bees to find shelter during rain; homed bees retain vanilla rain AI.
  rain-shelter: true

anvil-preservation:
  enabled: true
  warn-on-use: true
  cooldown-seconds: 30
harvest-indicators:
  enabled: true
  interval-ticks: 60
  radius: 8
  max-blocks-per-player: 300
  particle-chance: 0.10
pet-protection:
  enabled: true
  protect-own: true
  protect-others: false
  notify-attacker: true
item-frame-lock:
  enabled: true
  require-sneak-to-rotate: true
  require-sneak-to-remove: false
# Allow manual right-click opening/closing of iron doors.
# Redstone inputs still operate normally.
iron-door-interaction:
  enabled: true
  # Also allow players to right-click iron trapdoors.
  include-trapdoors: true
  play-sound: true
  respect-redstone: true
  auto-close:
    enabled: false
    delay-seconds: 5

grave-coordinates:
  enabled: true
  send-on-respawn: true
  send-on-death: false
tool-durability-warning:
  enabled: true
  threshold-percent: 10
  cooldown-seconds: 45
sign-editing:
  commands:
    enabled: true
    max-distance: 6
  enabled: true
  allow-color-codes: true
  allow-format-codes: false
  allow-hex-colors: false
  # Legacy colors: &0-&9, &a-&f; formatting: &k-&o, &r; RGB: &#RRGGBB
  # Permissions: vanillaplussuite.sign.color / .format / .hex

# Public messages are separate from private grave coordinates.
death-messages:
  enabled: true
  replace-vanilla: true
  environment:
    enabled: true
    chance: 0.30 # Chance of a contextual message when a matching context exists
  # Placeholders: {player}, {killer} (PvP only). Add/remove messages freely.
  messages:
    fall:
      - "{player} attempted to negotiate with gravity. Gravity declined."
      - "{player} discovered that the ground has excellent stopping power."
      - "{player} tried flying without reading the instructions."
    fall-near-lava:
      - "{player} took the scenic route toward the world's least inviting hot tub."
    fall-in-end:
      - "{player} learned that the End doesn't offer return flights."
    lava:
      - "{player} discovered that lava is not, in fact, a hot tub."
      - "{player} went for a swim in something aggressively warm."
    fire:
      - "{player} became a cautionary tale about fire safety."
      - "{player} forgot to stop, drop, and roll."
    drowning:
      - "{player} forgot that lungs are not optional accessories."
      - "{player} took a very long underwater tour."
    lightning:
      - "{player} received a strongly worded message from the sky."
    void:
      - "{player} explored the void. The void declined to comment."
    suffocation:
      - "{player} and a solid block had a disagreement about personal space."
    starvation:
      - "{player} learned that snacks are an essential survival tool."
    freezing:
      - "{player} took the phrase 'chill out' too literally."
    magic:
      - "{player} experienced some unfortunate chemistry."
    explosion:
      - "{player} participated in an unscheduled demolition."
      - "{player} went out with a bang."
    projectile:
      - "{player} failed to dodge the incoming correspondence."
    mob:
      - "{player} lost an argument with the local wildlife."
      - "{player} underestimated the neighbourhood watch."
    mob-near-village:
      - "{player} failed their performance review as village security."
    pvp:
      - "{player} was politely informed by {killer} that this is Hard Survival."
      - "{killer} sent {player} back to the respawn screen."
    generic-nether:
      - "{player} visited the Nether and received the traditional welcome."
    generic:
      - "{player} discovered that Hard difficulty is aptly named."
      - "{player} has left the survival experience. Their dignity did not survive."

# Visual AFK detection only: no invulnerability or changes to survival mechanics.
afk-detection:
  enabled: true
  # Five minutes of inactivity by default.
  timeout-seconds: 300
  check-interval-seconds: 5
  activity:
    movement: true
    look-around: true
    chat: true
    commands: true
    interactions: true
    inventory: true
  display:
    marker: "[AFK]"
    # Options: suffix (after player name), prefix (before player name).
    position: suffix
    # Minecraft named colors, e.g. dark_gray, gray, white, yellow, gold.
    name-color: dark_gray
    marker-color: yellow
    tab-list: true
    overhead-nametag: true
  # Chat announcements and private return notification.
  # Use {player} for the player's in-game name and & color codes.
  messages:
    broadcast-on-afk: true
    broadcast-on-return: true
    notify-on-return: true
    afk: "&7[Vanilla+] &e{player} &7is now AFK."
    return: "&7[Vanilla+] &e{player} &7is no longer AFK."
    private-return: "&7[Vanilla+] &eYour AFK status has been cleared."
  # Ignore tiny position changes; looking around still counts separately.
  movement-threshold: 0.05

# Clean-room Armored Elytras: combines dropped Elytra + chestplate on an anvil.
# Drop the resulting item onto a grindstone to recover both original items.
# Original item metadata and enchantments are retained for separation.
armored-elytras:
  enabled: true
  anvil-combining: true
  grindstone-separation: true
  # Also combine an Elytra and chestplate through the anvil GUI (either input order).
  anvil-gui-combining: true
  # Separate an Armored Elytra through the grindstone GUI; chestplate goes to inventory.
  # If the inventory is full, the chestplate is dropped at the player's feet.
  grindstone-gui-separation: true
  # If the combined item burns, its Netherite chestplate is recovered.
  netherite-fire-salvage: true
