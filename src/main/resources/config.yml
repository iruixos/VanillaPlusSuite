# =============================================================================
# VanillaPlusSuite — Configuration
# =============================================================================
# Quality-of-life modules for near-vanilla Hard Survival.
# These defaults reflect the maintained VanillaPlusSuite server configuration.
# Changes to some settings may require /vps reload or a server restart.
# =============================================================================

# -----------------------------------------------------------------------------
# Anvil Preservation
# Warns about nearby heavily damaged anvils; does not prevent breakage.
# -----------------------------------------------------------------------------
anvil-preservation:
  enabled: true
  warn-on-use: true
  cooldown-seconds: 30

# -----------------------------------------------------------------------------
# Harvest Indicators
# Displays particles near mature crops without harvesting them.
# -----------------------------------------------------------------------------
harvest-indicators:
  enabled: true
  interval-ticks: 60
  radius: 8
  max-blocks-per-player: 300
  particle-chance: 0.10

# -----------------------------------------------------------------------------
# Pet Protection
# Prevents direct player attacks against tamed animals.
# -----------------------------------------------------------------------------
pet-protection:
  enabled: true
  protect-own: true
  protect-others: false
  notify-attacker: true

# -----------------------------------------------------------------------------
# Item Frame Lock
# -----------------------------------------------------------------------------
item-frame-lock:
  enabled: true
  require-sneak-to-rotate: true
  require-sneak-to-remove: true

# -----------------------------------------------------------------------------
# Iron Door & Trapdoor Interaction
# Players can manually toggle iron doors/trapdoors; redstone remains functional.
# Auto-close applies to manually opened blocks, not redstone activation.
# -----------------------------------------------------------------------------
iron-door-interaction:
  enabled: true
  include-trapdoors: true
  play-sound: true
  respect-redstone: true
  auto-close:
    enabled: true
    delay-seconds: 2

# -----------------------------------------------------------------------------
# Grave Coordinates
# Sends death location privately after respawn; does not restore inventory.
# Note: send-on-death is retained for compatibility but is not acted upon by the
# current implementation.
# -----------------------------------------------------------------------------
grave-coordinates:
  enabled: true
  send-on-respawn: true
  send-on-death: false

# -----------------------------------------------------------------------------
# Tool Durability Warning
# -----------------------------------------------------------------------------
tool-durability-warning:
  enabled: true
  threshold-percent: 10
  cooldown-seconds: 45

# -----------------------------------------------------------------------------
# Sign Editing
# Standard colors: &0-&9, &a-&f | Formatting: &k-&o, &r | RGB: &#RRGGBB
# Controlled by vanillaplussuite.sign.color, .format, and .hex permissions.
# -----------------------------------------------------------------------------
sign-editing:
  enabled: true
  commands:
    enabled: true
    max-distance: 6
  allow-color-codes: true
  allow-format-codes: true
  allow-hex-colors: true
  # /sign glow [dye_color|#RRGGBB] and /sign unglow affect the entire front face.
  # Examples: /sign glow light_purple, /sign glow magenta, /sign glow #FFAAAA
  # Dye names select the glow outline colour without overwriting existing text styles.
  # Hex values select the nearest vanilla dye outline colour (not true RGB glow).
  # Existing line colours, bold, italic and other styling are preserved.
  # Requires sign.command; colours also require sign.color or sign.hex permissions.
  allow-glowing-text: true

# -----------------------------------------------------------------------------
# AFK Detection
# Visual/status notifications only; no damage immunity or survival changes.
# -----------------------------------------------------------------------------
afk-detection:
  enabled: true
  timeout-seconds: 300
  check-interval-seconds: 5
  # Only player movement input counts as activity; mob pushing, currents,
  # and other passive displacement do not clear AFK status.
  movement-threshold: 0.05

  # Applies ONLY to manual /afk commands; automatic AFK detection is unaffected.
  # Steps are numbered by successful uses of /afk in the current escalation streak:
  #   1st: 0 seconds; 2nd: 15 seconds; 3rd: 30 seconds;
  #   4th: 60 seconds; 5th and subsequent: 900 seconds (15 minutes).
  # The configured cooldown starts AFTER each successful command invocation.
  # After 5 minutes without a successful /afk command, the escalation resets.
  # An existing cooldown always runs to completion, even if reset time passes.
  manual-cooldown:
    steps-seconds: [0, 15, 30, 60, 900]
    reset-after-seconds: 300

  activity:
    movement: true
    look-around: true
    chat: true
    commands: true
    interactions: true
    inventory: true

  display:
    marker: "[AFK]"
    # Position options:
    #   suffix: Steve [AFK]
    #   prefix: [AFK] Steve
    position: suffix
    name-color: dark_gray
    marker-color: yellow
    tab-list: true
    overhead-nametag: true

  messages:
    broadcast-on-afk: true
    broadcast-on-return: true
    notify-on-return: false
    # {player} placeholder; Minecraft & color codes supported.
    afk: "&7[Vanilla+] &e{player} &7is now AFK."
    return: "&7[Vanilla+] &e{player} &7is no longer AFK."
    private-return: "&7[Vanilla+] &eYour AFK status has been cleared."

# -----------------------------------------------------------------------------
# Armored Elytras
# Combines an elytra and chestplate while preserving original item data.
# Both drop-on-block and inventory GUI methods are enabled.
# -----------------------------------------------------------------------------
armored-elytras:
  enabled: true
  # Drop both items onto an anvil / drop combined item onto a grindstone.
  anvil-combining: true
  grindstone-separation: true
  # Use the anvil / grindstone inventory GUI instead.
  anvil-gui-combining: true
  grindstone-gui-separation: true
  netherite-fire-salvage: true

# -----------------------------------------------------------------------------
# Bee Colony Cooperation (Experimental)
# Uses vanilla pollen delivery; does not directly create honey or spawn bees.
# -----------------------------------------------------------------------------
bee-colony-cooperation:
  enabled: true
  # Bees carrying nectar may use empty hives when their home has full honey.
  share-honey: true
  search-radius: 12
  scan-interval-ticks: 100
  search-cooldown-seconds: 30
  empty-hives-only: true
  include-bee-nests: true
  include-beehives: true
  ignore-full-hives: true
  # Sneak + empty-hand right-click to inspect a hive's occupants and honey.
  occupancy-inspection: true
  # Display particles when a monitored hive gains honey.
  activity-particles: true
  activity-radius: 8
  # Help homeless/displaced bees find a nearby hive.
  improved-hive-selection: true
  relocation-assistance: true
  # Homeless bees can seek shelter during rain.
  rain-shelter: true

# -----------------------------------------------------------------------------
# Persistent Passive Animal Drops
# Applies to freshly spawned animal products, not player-thrown items or death loot.
# Animal attribution is proximity-based; unusual adjacent item spawns can match.
# The timer is measured in real-world seconds, including unloaded intervals.
# -----------------------------------------------------------------------------
persistent-passive-drops:
  enabled: true
  chicken-eggs: true            # Eggs, blue eggs and brown eggs
  armadillo-scutes: true        # Naturally shed scutes (near armadillos)
  cat-morning-gifts: true       # Gift item types near tamed adult cats
  panda-slimeballs: true        # Slimeballs near pandas
  animal-detection-radius: 1.75
  lifetime-seconds: 1800        # Default: 30 minutes
  # WARNING: Indefinite drops can accumulate and cause server lag.
  # This overrides lifetime-seconds. Disabled by default.
  indefinite: false

# -----------------------------------------------------------------------------
# Unusual Block Breakage
# Allows Silk Touch pickaxes to recover normally unobtainable blocks.
# Protection plugins and Adventure/Creative rules are respected.
# -----------------------------------------------------------------------------
unusual-block-breakage:
  enabled: true
  budding-amethyst: true

# -----------------------------------------------------------------------------
# Mob Silencing
# Use a specially named Name Tag on a mob to silence it permanently.
# This does not overwrite its custom name; normal renaming still works later.
# Does not prevent damage, movement, or other vanilla mob behaviours.
# -----------------------------------------------------------------------------
mob-silencing:
  enabled: true
  # Supported names (case-insensitive; whitespace around the name is ignored).
  trigger-names:
    - "silence"
    - "silence me"
    - "silence-me"
    - "silence_me"
    - "silenceme"
  # Case-insensitive tags that restore normal mob sounds (without renaming).
  unsilence-names:
    - "unsilence"
    - "unsilence me"
    - "unsilence-me"
    - "unsilence_me"
    - "unsilenceme"
  # Cosmetic indicator only. The mob's real name remains unchanged.
  # Text displays are temporary and only maintained close to online players.
  indicator:
    enabled: true
    text: "[SILENCED]"
    color: gray
    visible-range: 16
    show-on-unnamed-mobs: true
  # Name Tags are consumed in Survival unless disabled here.
  # Never consumed in Creative; already-silent mobs don't consume another tag.
  consume-name-tag: true
  # Private confirmation to the player applying the Name Tag.
  notify-player: true

# -----------------------------------------------------------------------------
# Stackable Stews, Soups & Filled Buckets
# Changes only selected items' stack sizes; normal survival use is preserved.
# One stew consumed returns one empty wooden bowl; pouring one bucket returns
# one empty iron bucket. Vanilla drops remainders when inventory is full.
# -----------------------------------------------------------------------------
stackable-consumables:
  enabled: true

  # Configurable limits (1-99). A default of 16 retains inventory balance.
  stew-stack-size: 16
  bucket-stack-size: 16

  mushroom-stew: true
  rabbit-stew: true
  beetroot-soup: true
  suspicious-stew: true

  water-buckets: true
  lava-buckets: true

# -----------------------------------------------------------------------------
# Custom Death Messages
# Public messages are independent of private grave coordinates.
# Placeholders: {player}, and {killer} for PvP deaths.
# -----------------------------------------------------------------------------
death-messages:
  enabled: true
  replace-vanilla: true
  environment:
    enabled: true
    chance: 0.30 # Chance of a contextual message when a matching context exists
  # Placeholders: {player}, {killer} (PvP only). Add/remove messages freely.
  messages:
    fall:
      - "{player} attempted to negotiate with gravity. Gravity declined."
      - "{player} discovered that the ground has excellent stopping power."
      - "{player} tried flying without reading the instructions."
    fall-near-lava:
      - "{player} took the scenic route toward the world's least inviting hot tub."
    fall-in-end:
      - "{player} learned that the End doesn't offer return flights."
    lava:
      - "{player} discovered that lava is not, in fact, a hot tub."
      - "{player} went for a swim in something aggressively warm."
    fire:
      - "{player} became a cautionary tale about fire safety."
      - "{player} forgot to stop, drop, and roll."
    drowning:
      - "{player} forgot that lungs are not optional accessories."
      - "{player} took a very long underwater tour."
    lightning:
      - "{player} received a strongly worded message from the sky."
    void:
      - "{player} explored the void. The void declined to comment."
    suffocation:
      - "{player} and a solid block had a disagreement about personal space."
    starvation:
      - "{player} learned that snacks are an essential survival tool."
    freezing:
      - "{player} took the phrase 'chill out' too literally."
    magic:
      - "{player} experienced some unfortunate chemistry."
    explosion:
      - "{player} participated in an unscheduled demolition."
      - "{player} went out with a bang."
    projectile:
      - "{player} failed to dodge the incoming correspondence."
    mob:
      - "{player} lost an argument with the local wildlife."
      - "{player} underestimated the neighbourhood watch."
    mob-near-village:
      - "{player} failed their performance review as village security."
    pvp:
      - "{player} was politely informed by {killer} that this is Hard Survival."
      - "{killer} sent {player} back to the respawn screen."
    generic-nether:
      - "{player} visited the Nether and received the traditional welcome."
    generic:
      - "{player} discovered that Hard difficulty is aptly named."
      - "{player} has left the survival experience. Their dignity did not survive."
